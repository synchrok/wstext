name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install dependencies
        run: npm ci

      - name: Update version
        if: inputs.version != ''
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VERSION"
          node -e "const f='package.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VERSION"
          node -e "const fs=require('fs');const f='src-tauri/Cargo.toml';let c=fs.readFileSync(f,'utf8');c=c.replace(/^version = \".*\"/m,'version = \"'+process.argv[1]+'\"');fs.writeFileSync(f,c)" "$VERSION"
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ inputs.version || '0.0.0-dev' }}
          releaseName: 'WSText v${{ inputs.version || ''dev'' }}'
          releaseDraft: ${{ inputs.draft }}
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Rename portable EXE (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $src = "src-tauri/target/${{ matrix.target }}/release/WSText.exe"
          $dst = "WSText-portable.exe"
          if (Test-Path $src) {
            Copy-Item $src $dst
            Write-Host "Portable EXE created: $dst"
          } else {
            Write-Warning "Source EXE not found: $src"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstext-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
            WSText-portable.exe
          if-no-files-found: ignore

      - name: Upload portable EXE to Release (Windows only)
        if: matrix.platform == 'windows-latest' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: WSText-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up .sig files from Release
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          # Delete .sig files (signatures are already embedded in latest.json)
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".sig"))'); do
            echo "Removing $asset"
            gh release delete-asset "$TAG" "$asset" --yes || true
          done
